<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; stroke: #30363d; stroke-width: 1.5px; }
      .card { fill: #161b22; rx: 8px; stroke: #30363d; stroke-width: 1px; }
      .header-bg { fill: #21262d; }
      .tier-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; }
      .comp-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #f0f6fc; }
      .comp-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8b949e; }
      .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #79c0ff; text-anchor: middle; letter-spacing: 0.3px; }
      .flow-label-purple { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #d2a8ff; text-anchor: middle; letter-spacing: 0.3px; }
      .arrow-line { stroke: #388bfd; stroke-width: 1.75px; }
      .arrow-line-purple { stroke: #a371f7; stroke-width: 1.75px; }
      .flow-pill { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 4px; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#388bfd" />
    </marker>
    <marker id="arr-purp-end" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#a371f7" />
    </marker>
    <marker id="arr-purp-start" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 9 1 L 1 5 L 9 9 z" fill="#a371f7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="550" class="bg" />

  <!-- ================= TIER 1 ================= -->
  <g transform="translate(24, 20)">
    <rect width="912" height="96" class="card" />
    <!-- Header strip -->
    <path d="M 0 8 Q 0 0 8 0 L 904 0 Q 912 0 912 8 L 912 28 L 0 28 Z" class="header-bg" />
    <circle cx="16" cy="14" r="4.5" fill="#58a6ff" />
    <text x="28" y="18" class="tier-label" fill="#58a6ff">TIER 1: MULTI-CHANNEL EVENT INGRESS</text>

    <!-- 4 Columns -->
    <g transform="translate(18, 44)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <text y="12" class="comp-title">Slack API Webhooks</text>
        <text y="26" class="comp-desc">Mentions, Files, Thread DMs</text>
      </g>
      <!-- Col 2 -->
      <g transform="translate(225, 0)">
        <text y="12" class="comp-title">Gmail Event Triggers</text>
        <text y="26" class="comp-desc">Inbound AP Bills &amp; Support</text>
      </g>
      <!-- Col 3 -->
      <g transform="translate(450, 0)">
        <text y="12" class="comp-title">Google Drive Drops</text>
        <text y="26" class="comp-desc">Document Intake &amp; OCR</text>
      </g>
      <!-- Col 4 -->
      <g transform="translate(675, 0)">
        <text y="12" class="comp-title">MCP Protocol Ingress</text>
        <text y="26" class="comp-desc">Cursor, Claude &amp; IDE Tools</text>
      </g>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <line x1="480" y1="116" x2="480" y2="148" class="arrow-line" marker-end="url(#arr-blue)" />
  <rect x="360" y="123" width="240" height="18" class="flow-pill" />
  <text x="480" y="136" class="flow-label">Encrypted Ingress • TLS 1.3 Termination</text>

  <!-- ================= TIER 2 ================= -->
  <g transform="translate(24, 150)">
    <rect width="912" height="96" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 904 0 Q 912 0 912 8 L 912 28 L 0 28 Z" class="header-bg" />
    <circle cx="16" cy="14" r="4.5" fill="#f0883e" />
    <text x="28" y="18" class="tier-label" fill="#f0883e">TIER 2: PRODUCTION CLOUD GATEWAY (GCP us-central1-a)</text>

    <!-- 4 Columns -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <text y="12" class="comp-title">Cloudflare Zero Trust</text>
        <text y="26" class="comp-desc">Zero Public Inbound Ports</text>
      </g>
      <g transform="translate(225, 0)">
        <text y="12" class="comp-title">Docker Compose Stack</text>
        <text y="26" class="comp-desc">n8n Core on Compute Engine</text>
      </g>
      <g transform="translate(450, 0)">
        <text y="12" class="comp-title">systemd Auto-Healing</text>
        <text y="26" class="comp-desc">Zero-Downtime Host Daemon</text>
      </g>
      <g transform="translate(675, 0)">
        <text y="12" class="comp-title">Safety Guardrails</text>
        <text y="26" class="comp-desc">Anti-Loop NoOp &amp; Contracts</text>
      </g>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <line x1="480" y1="246" x2="480" y2="278" class="arrow-line" marker-end="url(#arr-blue)" />
  <rect x="370" y="253" width="220" height="18" class="flow-pill" />
  <text x="480" y="266" class="flow-label">Normalized Payloads &amp; Schemas</text>

  <!-- ================= TIER 3 ================= -->
  <g transform="translate(24, 280)">
    <rect width="912" height="96" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 904 0 Q 912 0 912 8 L 912 28 L 0 28 Z" class="header-bg" />
    <circle cx="16" cy="14" r="4.5" fill="#bc8cff" />
    <text x="28" y="18" class="tier-label" fill="#bc8cff">TIER 3: RESILIENT MULTI-LLM REASONING MESH</text>

    <!-- 4 Columns -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <text y="12" class="comp-title">Groq LPU (Primary)</text>
        <text y="26" class="comp-desc">GPT-OSS 120B / LLaMA 3.3</text>
      </g>
      <g transform="translate(225, 0)">
        <text y="12" class="comp-title">Gemini 2.5 Flash Lite</text>
        <text y="26" class="comp-desc">Automated 429 Failover</text>
      </g>
      <g transform="translate(450, 0)">
        <text y="12" class="comp-title">LangChain ReAct Agent</text>
        <text y="26" class="comp-desc">Dynamic Tool Dispatcher</text>
      </g>
      <g transform="translate(675, 0)">
        <text y="12" class="comp-title">MCP Tool Server</text>
        <text y="26" class="comp-desc">Standardized Negotiation</text>
      </g>
    </g>
  </g>

  <!-- Flow 3 -> 4 (Bi-directional) -->
  <line x1="480" y1="380" x2="480" y2="408" class="arrow-line-purple" marker-start="url(#arr-purp-start)" marker-end="url(#arr-purp-end)" />
  <rect x="360" y="385" width="240" height="18" class="flow-pill" />
  <text x="480" y="398" class="flow-label-purple">Dense Vector RAG • State Preservation</text>

  <!-- ================= TIER 4 ================= -->
  <g transform="translate(24, 412)">
    <rect width="912" height="96" class="card" />
    <path d="M 0 8 Q 0 0 8 0 L 904 0 Q 912 0 912 8 L 912 28 L 0 28 Z" class="header-bg" />
    <circle cx="16" cy="14" r="4.5" fill="#3fb950" />
    <text x="28" y="18" class="tier-label" fill="#3fb950">TIER 4: KNOWLEDGE BASES &amp; SYSTEMS OF RECORD</text>

    <!-- 4 Columns -->
    <g transform="translate(18, 44)">
      <g transform="translate(0, 0)">
        <text y="12" class="comp-title">Pinecone Serverless</text>
        <text y="26" class="comp-desc">3072-dim Gemini Vector Index</text>
      </g>
      <g transform="translate(225, 0)">
        <text y="12" class="comp-title">Thread Memory Buffer</text>
        <text y="26" class="comp-desc">10-Turn Context Window</text>
      </g>
      <g transform="translate(450, 0)">
        <text y="12" class="comp-title">Google Sheets Ledgers</text>
        <text y="26" class="comp-desc">Deterministic Financial Records</text>
      </g>
      <g transform="translate(675, 0)">
        <text y="12" class="comp-title">Google Cloud Storage</text>
        <text y="26" class="comp-desc">Automated Hot Backups</text>
      </g>
    </g>
  </g>
</svg>